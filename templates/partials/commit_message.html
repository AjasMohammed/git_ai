<div
    class="w-full h-full bg-white text-black rounded-2xl p-12 relative shadow-lg"
>
    {% if commit_message %}
    <pre class="w-full h-full overflow-y-hidden">
    <textarea id="commit-message" name="" class="w-full h-full outline-none">{{ commit_message }}</textarea></pre>

    <!-- Button to copy the text in the textarea to clipboard  -->
    <button
        onclick="copyToClipboard(document.getElementById('commit-message').value)"
        class="absolute top-4 right-4 bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 transition"
    >
        Copy
    </button>
    {% else %}
    <p class="w-full h-full flex items-center justify-center text-gray-500 text-2xl">
        Select a Repository to Generate Commit Message
    </p>
    {% endif %}
</div>
