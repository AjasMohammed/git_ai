<!-- Floating toggle and sidebar wrapper -->
<div class="fixed top-1/4 right-0 z-50 -translate-y-1/2">
    <!-- Floating Toggle Button -->
    <div
        id="toggleBtn"
        class="bg-black text-white px-4 py-3 rounded-l-lg font-bold cursor-pointer shadow-lg transition-transform duration-200 hover:scale-105"
    >
        ≡
    </div>

    <!-- Sidebar (hidden by default) -->
    <nav
        id="sidebar"
        class="absolute top-1/2 right-[-2rem] origin-right scale-0 opacity-0 -translate-y-1/2 transition-all duration-300 ease-out bg-white rounded-l-xl px-6 py-6 shadow-2xl w-48"
    >
        <div class="flex flex-col gap-4">
            <a href="/?tab=git"
                class="border-2 border-black rounded-lg font-semibold text-lg px-4 py-2 bg-white hover:bg-black hover:text-white hover:shadow-[8px_8px_0_rgba(0,0,0,0.7)] hover:-translate-y-1 hover:-translate-x-1 transition-all duration-200"
            >
                <h4>GIT</h4>
            </a>

            <a href="/?tab=task"
                class="border-2 border-black rounded-lg font-semibold text-lg px-4 py-2 bg-white hover:bg-black hover:text-white hover:shadow-[8px_8px_0_rgba(0,0,0,0.7)] hover:-translate-y-1 hover:-translate-x-1 transition-all duration-200"
            >
                <h4>TASK</h4>
            </a>
        </div>
    </nav>
</div>

<script>
    const toggleBtn = document.getElementById('toggleBtn');
    const sidebar = document.getElementById('sidebar');
    let isOpen = false;

    // Toggle on click
    toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // prevent immediate close
        isOpen = !isOpen;
        updateSidebar();
    });

    // Close when clicking outside
    document.addEventListener('click', (e) => {
        if (isOpen && !sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
            isOpen = false;
            updateSidebar();
        }
    });

    function updateSidebar() {
        if (isOpen) {
            sidebar.classList.remove('scale-0', 'opacity-0');
            sidebar.classList.add('scale-100', 'opacity-100');
        } else {
            sidebar.classList.remove('scale-100', 'opacity-100');
            sidebar.classList.add('scale-0', 'opacity-0');
        }
    }
</script>
