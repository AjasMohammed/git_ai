<div id="sheet-data">
    <form action="" hx-post="/fetch-sheets" hx-swap="innerHTML">
        <h4
            class="text-md w-full font-semibold mb-4 border-b border-black py-2 px-4"
        >
            ADD SHEET
        </h4>
        <label for="sheet_id">
            <input
                type="text"
                name="sheet_id"
                id="sheet_id"
                placeholder="Enter Sheet ID"
                class="w-full px-4 py-2 border-2 border-black focus:outline-none shadow-[2px_2px_0_rgba(0,0,0,0.3)_inset] uppercase font-semibold tracking-widest mb-4"
            />
        </label>
        <button
            type="button"
            class="px-4 py-2 text-black border-2 border-black shadow-[4px_4px_0_rgba(0,0,0,0.7)] font-semibold uppercase tracking-widest hover:shadow-none hover:translate-y-[4px] hover:translate-x-[4px] transition-all rounded-lg"
        >
            FETCH SHEET
        </button>
    </form>
    {% if sheets %}

    {% else %}
    {% endif %}
</div>
